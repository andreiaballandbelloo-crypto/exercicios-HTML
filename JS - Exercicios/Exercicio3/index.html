<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Três</title>
</head>
<body>
    
    <header>
        <h1>Média de 5 pesos</h1>
    </header>
    
    <!-- Seção de inputs -->
    <section>
        <input type="number" id="peso1" min="1" placeholder="Primeiro peso:">
        <input type="number" id="peso2" min="1" placeholder="Segundo peso:">
        <input type="number" id="peso3" min="1" placeholder="Terceiro peso:">
        <input type="number" id="peso4" min="1" placeholder="Quarto peso:">
        <input type="number" id="peso5" min="1" placeholder="Quinto peso:">
    </section>

    <button id="btnCalcular">Calcular Média</button>

    <p id="resultado"></p>

    <script src="./script.js"></script>
</body>
</html>
